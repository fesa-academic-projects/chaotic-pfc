[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chaotic-pfc"
version = "0.8.0"
description = "Pecora-Carroll chaos-based communication with FIR-filtered Hénon map"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "chaos",
    "henon-map",
    "lyapunov-exponents",
    "dynamical-systems",
    "nonlinear-dynamics",
    "scientific-computing",
    "pecora-carroll",
    "chaos-synchronisation",
    "fir-filter",
]
authors = [
    { name = "Kauê de Souza Silva", email = "kaue.moelas.com@gmail.com" },
    { name = "Roger Freitas Pereira", email = "roger_freitas@live.com" },
    { name = "Marcos Felipe Correa Soares", email = "marcosfelipe.soares2014@gmail.com" },
    { name = "Guilherme Rodrigues dos Santos", email = "guilhermerodriguess130@gmail.com" },
    { name = "Vinícius da Silva Borges" },
]
dependencies = [
    # SPEC 0 (https://scientific-python.org/specs/spec-0000/): support Python
    # and core packages for 3 and 2 years respectively. Reviewed 2026-10-14.
    "numpy>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.11",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/fesa-academic-projects/chaotic-pfc"
Documentation = "https://chaotic-pfc.readthedocs.io"
Repository = "https://github.com/fesa-academic-projects/chaotic-pfc"
Issues = "https://github.com/fesa-academic-projects/chaotic-pfc/issues"

[project.optional-dependencies]
fast = [
    "numba>=0.61.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "sphinx-copybutton>=0.5",
    "sphinx-intl>=2.0",
    "jupyter>=1.0",
]
viz3d = [
    "plotly>=5.18",
]

[project.scripts]
chaotic-pfc = "chaotic_pfc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chaotic_pfc" = ["py.typed"]
"chaotic_pfc.paper" = ["doi_whitelist.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
strict_markers = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "contract: public-API contract fuzzing (short profile in the normal CI run)",
    "contract_deep: long contract fuzzing (scheduled weekly workflow)",
]

[tool.pytest-benchmark]
# Use 5 rounds so throughput numbers are reliable
rounds = 5
timer = "time.perf_counter"

# ───────────────────────────────────────────────────────────────────────────
# Coverage — measurement config for pytest-cov
# ───────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["chaotic_pfc"]
branch = true
omit = [
    "*/__main__.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false

# ───────────────────────────────────────────────────────────────────────────
# Ruff — linter + formatter
# ───────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "figures", ".venv"]

[tool.ruff.lint]
# Curated set of rule families. Every family is tagged with its origin.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modernise syntax)
    "SIM", # flake8-simplify (readability)
    "D",   # pydocstyle (NumPy docstring convention)
    "RUF", # Ruff-specific rules
]
ignore = [
    "E741",  # ambiguous variable name — common in math code (l, I, O)
    "E501",  # line too long — the formatter handles this where it can
    # Unicode characters used intentionally in mathematical docstrings
    # (α, β, λ, em-dashes, minus signs, subscripts, etc.).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests can use longer lines, unused imports (fixtures), and magic constants
"tests/**" = ["E501", "F401", "B011", "D"]
# Command-line tools and benchmarks are scripts: no NumPy docstring convention
"tools/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["chaotic_pfc"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ───────────────────────────────────────────────────────────────────────────
# mypy — static type checking
# ───────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
files = ["src/chaotic_pfc"]
strict = true
ignore_missing_imports = true  # numba, scipy, etc. ship partial stubs

# Scientific libs have inconsistent stubs — don't let their noise drown signal
[[tool.mypy.overrides]]
module = ["numba.*", "scipy.*", "matplotlib.*"]
ignore_errors = true

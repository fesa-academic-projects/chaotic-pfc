# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      scientific-core:
        # numpy, scipy and numba must move together: their ABI/API coupling
        # means a single grouped PR is the only way to review the change, and a
        # baseline failure here is expected when the bits change (see
        # CONTRIBUTING/RELEASING).
        patterns:
          - "numpy"
          - "scipy"
          - "numba"
      dev-deps:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pre-commit"
        update-types:
          - "minor"
          - "patch"
      docs-deps:
        patterns:
          - "sphinx*"
          - "furo"
          - "sphinx-copybutton"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more declare it explicitly.
permissions:
  contents: read

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 now to silence the Node.js 20 deprecation warning.
# Actions will be forced to Node.js 24 by default from June 2nd, 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Numba writes its JIT artefacts here so a single cache can hold them.
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Build the wheel and sdist once; every other job (and the release) reuses
  # the ``dist`` artefact instead of rebuilding the package.
  # ───────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify the distribution contents
        run: |
          set -eu
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          echo "== wheel: $wheel =="; unzip -l "$wheel"
          echo "== sdist: $sdist =="; tar tzf "$sdist"
          # Required package data.
          unzip -l "$wheel" | grep -q 'chaotic_pfc/py.typed'
          unzip -l "$wheel" | grep -q 'chaotic_pfc/paper/doi_whitelist.txt'
          unzip -l "$wheel" | grep -qE '\.dist-info/licenses/LICENSE'
          tar tzf "$sdist" | grep -q 'src/chaotic_pfc/py.typed'
          tar tzf "$sdist" | grep -q 'LICENSE'
          # Forbidden: the versioned data and the manuscript artefacts.
          if unzip -l "$wheel" | grep -qE 'data/sweeps|articles/|/figures/'; then
            echo "::error::the wheel contains data/sweeps, articles/ or figures/"; exit 1
          fi
          if tar tzf "$sdist" | grep -qE 'data/sweeps|articles/|/figures/'; then
            echo "::error::the sdist contains data/sweeps, articles/ or figures/"; exit 1
          fi
          echo "distribution contents OK"

      - name: Upload the distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # Lint: Ruff check + format check
  # Fast, independent. Must pass before typecheck or test runs.
  # ───────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: pip install "ruff>=0.6"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ───────────────────────────────────────────────────────────────────────
  # Type check: mypy on the library (src/chaotic_pfc)
  # ───────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev,fast]"

      - name: Run mypy
        run: mypy --strict src/chaotic_pfc

  # ───────────────────────────────────────────────────────────────────────
  # Unit tests: pytest with coverage, upload to Codecov.
  # Runs only after lint and typecheck both pass.
  # ───────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests (pytest ${{ matrix.python-version }})
    needs: [build, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev,fast,viz3d,test]"

      - name: Cache Numba JIT artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run the unit tests
        run: |
          pytest \
            --tb=short \
            --cov=chaotic_pfc \
            --cov-fail-under=75 \
            --cov-report=xml \
            --cov-report=term \
            --hypothesis-profile=ci

      - name: Smoke-test the benchmarks
        run: pytest benchmarks --benchmark-disable -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ───────────────────────────────────────────────────────────────────────
  # SPEC 0 minimum versions: install exactly the declared floors (Python 3.13,
  # NumPy 2.2, SciPy 1.15, Matplotlib 3.11) and run the whole suite, so an
  # accidental use of a newer API is caught. If a declared minimum breaks,
  # adjust the floor, not the test.
  # ───────────────────────────────────────────────────────────────────────
  minimums:
    name: Minimum versions (SPEC 0)
    needs: [build, lint, typecheck]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the SPEC 0 minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.2.*" "scipy==1.15.*" "matplotlib==3.11.*" "numba==0.61.2"
          pip install --find-links dist "chaotic-pfc[dev,fast]"
          python -c "import numpy, scipy, matplotlib, numba; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'matplotlib', matplotlib.__version__, 'numba', numba.__version__)"

      - name: Run the suite on the minimum versions
        run: pytest -q

  # ───────────────────────────────────────────────────────────────────────
  # Static analysis rules that remember past incidents (see .semgrep/).
  # ───────────────────────────────────────────────────────────────────────
  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install "semgrep>=1.100"

      - name: Run the incident-based rules
        run: semgrep --config .semgrep --error .

  # ───────────────────────────────────────────────────────────────────────
  # Contract fuzzing with Numba JIT disabled. The contract suite checks that
  # every public function either returns a coherent value or raises a domain
  # error. Running it in pure Python matters because an out-of-bounds access
  # inside a Numba ``prange`` is NOT reported by NUMBA_BOUNDSCHECK=1 (verified),
  # while the interpreted kernel raises IndexError and fails the test.
  # ───────────────────────────────────────────────────────────────────────
  contract:
    name: Contract fuzzing (pure Python)
    needs: [build, lint, typecheck]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev,fast]"

      - name: Run the contract and kernel suites without JIT
        env:
          NUMBA_DISABLE_JIT: "1"
          CHAOTIC_PFC_FORCE_LATEX: "0"
        run: |
          pytest -q \
            tests/test_contract.py \
            tests/test_kernel_paths.py \
            tests/test_sweep_kernel.py \
            tests/test_compat.py

  # ───────────────────────────────────────────────────────────────────────
  # Silent NaN/overflow gate: promote every RuntimeWarning to an error. Expected
  # warnings (intentional divergence, degenerate synthetic samples) are handled
  # with np.errstate at the source, never with a global filter.
  # ───────────────────────────────────────────────────────────────────────
  runtime-warnings:
    name: RuntimeWarning gate
    needs: [build, lint, typecheck]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev,fast,test]"

      - name: Run the fast suite with RuntimeWarning as an error
        env:
          CHAOTIC_PFC_FORCE_LATEX: "0"
        run: pytest -q -m "not slow" -W error::RuntimeWarning --hypothesis-profile=ci

  # ───────────────────────────────────────────────────────────────────────
  # Numba baseline regression: the versioned .npz checkpoints must be
  # reproduced bit for bit by the current kernel. This requires Numba, so it
  # is a separate job with the [fast] extra.
  # ───────────────────────────────────────────────────────────────────────
  baseline:
    name: Numba baseline regression
    needs: [build, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev,fast]"

      - name: Cache Numba JIT artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py3.14-

      - name: Run the bit-exact sweep baseline
        run: CHAOTIC_PFC_RUN_BASELINE=1 pytest -q tests/test_sweep_regressions.py

  # ───────────────────────────────────────────────────────────────────────
  # Pure-Python fallback: the package must import and the kernels must run
  # without Numba. Installs without the [fast] extra and forces Numba's JIT
  # off, then exercises the compatibility layer and the sweep kernel paths.
  # ───────────────────────────────────────────────────────────────────────
  no-numba:
    name: Pure-Python fallback (no Numba)
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install without the Numba extra
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev]"

      - name: Run the pure-Python fallback tests
        run: NUMBA_DISABLE_JIT=1 pytest -q tests/test_compat.py tests/test_kernel_paths.py

  # ───────────────────────────────────────────────────────────────────────
  # Pipeline smoke test: runs only if unit tests passed, and only on
  # pushes to main (not on PRs, where fast lint+test feedback matters).
  # ───────────────────────────────────────────────────────────────────────
  pipeline:
    name: Pipeline smoke test
    needs: test
    if: github.ref_type != 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[dev,fast]"

      - name: Cache Numba JIT artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py3.14-

      - name: Run the full pipeline (quick sweep)
        run: chaotic-pfc run all --no-display --quick-sweep

  # ───────────────────────────────────────────────────────────────────────
  # Tutorial notebook: ensure examples/tour.ipynb executes without errors.
  # ───────────────────────────────────────────────────────────────────────
  notebook:
    name: Tutorial notebook
    needs: [build, lint]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[fast,docs]"

      - name: Cache Numba JIT artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py3.14-

      - name: Execute the tutorial notebook
        run: |
          jupyter nbconvert --to notebook --execute examples/tour.ipynb \
            --output /tmp/tour_executed.ipynb

  # ───────────────────────────────────────────────────────────────────────
  # Performance benchmarks: compare against baseline on PRs only.
  # ───────────────────────────────────────────────────────────────────────
  benchmark:
    name: Performance benchmarks
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[fast,dev]"

      - name: Cache Numba JIT artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py3.14-${{ hashFiles('pyproject.toml', 'src/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py3.14-

      - name: Run benchmarks and compare against baseline
        run: |
          pytest benchmarks/ --benchmark-only \
            --benchmark-compare=benchmarks/baseline/baseline_v0_7_0.json \
            --benchmark-compare-fail=mean:25%

  # ───────────────────────────────────────────────────────────────────────
  # REUSE compliance: every file must declare its licence (via headers or
  # REUSE.toml annotations).
  # ───────────────────────────────────────────────────────────────────────
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install REUSE
        run: |
          python -m pip install --upgrade pip
          pip install "reuse[charset-normalizer]"

      - name: Run reuse lint
        run: reuse lint

  # ───────────────────────────────────────────────────────────────────────
  # Manuscript audit: cross-checks articles/jcis/article.tex against the bibliography,
  # figures and identity tables on every push and pull request.
  # ───────────────────────────────────────────────────────────────────────
  paper-check:
    name: Manuscript audit (check-paper)
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist chaotic-pfc

      - name: Audit the manuscript
        run: make check-paper PYTHON=python

  # ───────────────────────────────────────────────────────────────────────
  # Manuscript PDF: rebuild article.pdf inside the pinned TeX Live image and
  # compare it byte for byte with the versioned artefact. ``make paper-pdf``
  # produces that artefact with the same image, so the two must match.
  # ───────────────────────────────────────────────────────────────────────
  paper-pdf:
    name: Manuscript PDF reproducibility
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: texlive/texlive@sha256:acd65bd2c60671fe1537e35440b5d6374ccdcbe3e7fa8a8d7a285fc045c78ed4

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Inkscape and the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends inkscape make git
          inkscape --version
          pdflatex --version | head -1

      - name: Rebuild the manuscript PDF
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make paper-pdf-build

      - name: Compare with the versioned PDF
        run: |
          set -eu
          git show HEAD:articles/jcis/article.pdf > /tmp/committed.pdf
          committed=$(sha256sum /tmp/committed.pdf | cut -d' ' -f1)
          rebuilt=$(sha256sum articles/jcis/article.pdf | cut -d' ' -f1)
          echo "committed: $committed"
          echo "rebuilt:   $rebuilt"
          if [ "$committed" != "$rebuilt" ]; then
            echo "::error::the rebuilt PDF differs from the versioned one;"
            echo "::error::run 'make paper-pdf' and commit articles/jcis/article.pdf"
            exit 1
          fi
          echo "OK: the rebuilt PDF is byte-identical to the versioned artefact."

  # ───────────────────────────────────────────────────────────────────────
  # Release: publish the artefact built by ``build`` to TestPyPI. Only
  # triggers on version tags, after the tests and the baseline have passed.
  # Uses OIDC trusted publishing — no API token needed.
  # ───────────────────────────────────────────────────────────────────────
  release-testpypi:
    name: Publish to TestPyPI
    needs: [lint, typecheck, test, baseline, build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      id-token: write  # OIDC token for TestPyPI Trusted Publishing (no API token)
      contents: read

    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  # ───────────────────────────────────────────────────────────────────────
  # Real PyPI release: only on a ``v*`` tag, after TestPyPI succeeded. Uses
  # OIDC Trusted Publishing (no API token); the PyPI project and its Trusted
  # Publisher are registered manually (see RELEASING).
  # ───────────────────────────────────────────────────────────────────────
  release-pypi:
    name: Publish to PyPI
    needs: [release-testpypi]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing (no API token)
      contents: read

    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ───────────────────────────────────────────────────────────────────────
  # Documentation: Sphinx build on every push and pull request (not on tags),
  # after the unit tests.
  # ───────────────────────────────────────────────────────────────────────
  docs:
    name: Documentation (Sphinx)
    needs: test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the package distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install the package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links dist "chaotic-pfc[docs]"

      - name: Install gettext (provides msgfmt and msgcat)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext

      - name: Build HTML documentation (strict)
        run: sphinx-build -W -n --keep-going -b html docs docs/_build/html

      - name: Run the doctests
        run: sphinx-build -b doctest docs docs/_build/doctest

      - name: Verify the pt-BR narrative catalogues
        run: tools/check_pt_br_translations.sh

      - name: Upload docs as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

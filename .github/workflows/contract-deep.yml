name: Contract fuzzing (deep)

# Weekly long run of the ``contract_deep`` marker. The normal CI run executes
# the short contract profile on every push; this workflow explores more
# two-argument mutations without blocking any pull request.
on:
  schedule:
    # Every Sunday at 03:17 UTC.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CHAOTIC_PFC_FORCE_LATEX: "0"

jobs:
  contract-deep:
    name: Contract fuzzing (deep profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast]"

      - name: Run the deep contract profile
        env:
          NUMBA_DISABLE_JIT: "1"
        run: pytest -q tests/test_contract.py -m contract_deep --hypothesis-profile=ci

# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%   # warn at -0.5%, fail at -2%
        base: auto
    patch:
      default:
        target: auto
        threshold: 5%

comment: false  # disable PR comments; rely on the check status instead

# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%   # fail once coverage drops more than 2% below the base
        base: auto
    patch:
      default:
        target: auto
        threshold: 5%

comment: false  # disable PR comments; rely on the check status instead

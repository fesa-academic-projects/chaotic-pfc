# Pre-commit hooks for chaotic-pfc
#
# Install once:   pre-commit install
# Run manually:   pre-commit run --all-files
# Update hooks:   pre-commit autoupdate
#
# These hooks run on every `git commit` and reject the commit if any
# check fails. The same checks run on the CI, so this is mostly a
# convenience for catching problems locally without waiting for a
# push round-trip.

repos:
  # ── Basic file hygiene (fast, bundled with pre-commit) ────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: end-of-file-fixer
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: check-yaml
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: check-toml
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: check-merge-conflict
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: check-added-large-files
        args: ["--maxkb=2500"]
        # The versioned sweep checkpoints and the manuscript PDFs are the only
        # intentionally large tracked files; figures hold vector sources.
        exclude: ^(figures/|data/sweeps/|articles/.*\.pdf$)
      - id: check-ast
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: check-case-conflict
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: debug-statements
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: mixed-line-ending
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)
      - id: detect-private-key
        exclude: ^(figures/|data/|docs/locale/|articles/[^/]+/Figures/)

  # ── Image optimization (manual — run with `make images` or
  #    pre-commit run --hook-stage manual --all-files) ────────────────────
  - repo: https://github.com/boidolr/pre-commit-images
    rev: v1.12.0
    hooks:
      - id: optimize-svg
        stages: [manual]

  # ── Ruff — lint and format (fast, runs in milliseconds) ───────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── mypy — static type checking (uses project's pyproject.toml) ───────
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/chaotic_pfc
        language: system
        pass_filenames: false
        types: [python]

  # ── Repository guard rails ───────────────────────────────────────────────
  # Frozen artefact trees (versioned sweeps, SIMAC record, JCIS figures) and
  # their SHA-256 manifests. Override the first hook with
  # CHAOTIC_PFC_ALLOW_FROZEN=1 only for a deliberate regeneration.
  - repo: local
    hooks:
      - id: frozen-artifacts
        name: frozen artefact trees are read-only
        entry: tools/check_frozen_artifacts.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: artefact-manifests
        name: SHA256SUMS manifests match the frozen artefacts
        entry: tools/check_sweeps_manifest.sh
        language: system
        pass_filenames: false
        always_run: true

  # ── pyproject.toml validation ──────────────────────────────────────────
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  # ── CITATION.cff validation ────────────────────────────────────────────
  # cffconvert ships its pre-commit manifest only on main, not in the
  # 2.0.0 tag, so the revision is pinned to the commit README recommends.
  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
